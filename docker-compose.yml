name: kl-assignment
services:
  kl-assignment-db:
    container_name: kl-assignment-db
    image: mysql:8.4
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        - CMD
        - mysqladmin
        - ping
        - -h
        - 127.0.0.1
        - --silent
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s
    networks:
      - app-net
  migrate:
    image: migrate/migrate
    command:
      - "-path=/migrations"
      - "-database"
      - "mysql://${DB_USER}:${DB_PASSWORD}@tcp(kl-assignment-db:3306)/${DB_NAME}"
      - "up"
    volumes:
      - ./migrations:/migrations:ro
    depends_on:
      kl-assignment-db:
        condition: service_healthy
    networks:
      - app-net
  api:
    build: .
    ports:
      - "${PORT}:${PORT}"
    volumes:
      - ./.env:/app/.env:ro
    env_file:
      - .env
    environment:
      PORT: ${PORT}
      DB_HOST: ${DB_HOST}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_PORT: ${DB_PORT}
    depends_on:
      kl-assignment-db:
        condition: service_healthy
    networks:
      - app-net

volumes:
  mysql_data:

networks:
  app-net:
    driver: bridge